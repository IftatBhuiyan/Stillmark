<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#182c40" flood-opacity=".12"/></filter></defs><rect width="720" height="460" fill="#f4f1e8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="68" y="58" width="584" height="340" rx="12" fill="#fff" filter="url(#shadow)"/><text x="96" y="100" font-size="13" fill="#53655b" font-weight="700">FIELDNOTES</text><path d="M96 118L624 118" stroke="#dfe5ea" stroke-width="2" fill="none"/><text x="102" y="166" font-size="29" fill="#20372f" font-weight="600">The details that matter.</text><rect x="102" y="202" width="492" height="36" rx="2" fill="#ffe994" /><text x="102" y="229" font-size="23" fill="#202126" font-weight="400">Bring a jacket. The evenings get cool.</text><text x="102" y="275" font-size="22" fill="#727976" font-weight="400">Leave the rest of the day unplanned.</text></g></svg>