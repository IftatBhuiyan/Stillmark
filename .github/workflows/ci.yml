name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: app/global.json
      - name: Scan tracked application source
        working-directory: app
        shell: powershell
        run: ./tools/security/Test-SourceSecrets.ps1
      - name: Restore locked dependencies
        working-directory: app
        run: dotnet restore WinShot.sln --locked-mode
      - name: Build
        working-directory: app
        run: dotnet build WinShot.sln -c Release --no-restore
      - name: Test
        working-directory: app
        run: dotnet test WinShot.sln -c Release --no-build --logger "trx;LogFilePrefix=windows" --results-directory ../dist/test-results
      - name: Package portable app
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-test-results
          path: dist/test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: |
            dist/Stillmark-Windows-x64.zip
            dist/Stillmark-Windows-x64.zip.sha256
          if-no-files-found: error
  mac:
    name: Mac universal build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and verify universal bundle
        run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-release
          path: |
            dist/Stillmark-macOS-universal.zip
            dist/Stillmark-macOS-universal.zip.sha256
          if-no-files-found: error
  website:
    name: Website validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm run build
        working-directory: website
