name: Bug report
description: Report a reproducible problem
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Website]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App and operating-system versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, and actual result
      description: Do not include private captures, license keys, customer data, or credentials.
    validations:
      required: true
